name: Windows runtime

on:
  pull_request:
    paths:
      - "scripts/package-windows.ps1"
      - "frontend/**"
      - "src/**"
      - "configs/**"
      - "pyproject.toml"
      - ".github/workflows/windows-runtime.yml"
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build and smoke Windows x64 runtime
        working-directory: frontend
        run: npm run package:windows -- -Smoke
      - name: Print runtime evidence
        if: always()
        shell: pwsh
        run: if (Test-Path .build/windows-x64/runtime-manifest.json) { Get-Content .build/windows-x64/runtime-manifest.json }
