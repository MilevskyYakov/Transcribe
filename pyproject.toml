[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnema"
version = "0.1.3"
description = "Local-first transcription pipeline scaffold for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "librosa>=0.11.0",
  "numpy>=2.0",
  "onnx-asr[cpu,hub]>=0.11.0",
  "openai-whisper>=20250625",
  "PyYAML>=6.0",
  "resemblyzer>=0.1.4",
  "scikit-learn>=1.8.0",
  "setuptools<81",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
mnema = "mnema.cli.main:console_main"
transcribe-doc = "mnema.cli.main:console_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["mnema"]
strict = false
